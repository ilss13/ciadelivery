name: ciadelivery

x-backend-environment: &backend-environment
  DATABASE_HOST: mysql
  DATABASE_PORT: '3306'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  STORAGE_LOCAL_DIR: /var/lib/ciadelivery/storage

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: '${DATABASE_NAME}'
      MYSQL_USER: '${DATABASE_USER}'
      MYSQL_PASSWORD: '${DATABASE_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:-ciadelivery}'
    ports:
      - '${MYSQL_HOST_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    image: ciadelivery-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      <<: *backend-environment
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    volumes:
      - media_data:/var/lib/ciadelivery/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+process.env.API_PORT+'/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    image: ciadelivery-worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      <<: *backend-environment
    ports:
      - '${WORKER_PORT:-3001}:${WORKER_PORT:-3001}'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+process.env.WORKER_PORT+'/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  landing:
    image: ciadelivery-landing
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        BUILD_CONFIGURATION: local
    ports:
      - '4200:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  storefront:
    image: ciadelivery-storefront
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        BUILD_CONFIGURATION: local
    ports:
      - '4201:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  admin:
    image: ciadelivery-admin
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        BUILD_CONFIGURATION: local
    ports:
      - '4202:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  courier:
    image: ciadelivery-courier
    build:
      context: .
      dockerfile: apps/courier/Dockerfile
      args:
        BUILD_CONFIGURATION: local
    ports:
      - '4203:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql_data:
  media_data:
