name: ciadelivery

x-backend-environment: &backend-environment
  NODE_ENV: local
  API_PORT: '3000'
  WORKER_PORT: '3001'
  DATABASE_HOST: mysql
  DATABASE_PORT: '3306'
  DATABASE_USER: ciadelivery
  DATABASE_PASSWORD: ciadelivery
  DATABASE_NAME: ciadelivery
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  PLATFORM_DOMAIN: localhost
  JWT_ACCESS_SECRET: local-development-jwt-access-secret
  DATABASE_POOL_SIZE: '10'
  CORS_ORIGINS: http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203,http://pizzariadoze.localhost:4201,http://burgercentral.localhost:4201

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ciadelivery
      MYSQL_USER: ciadelivery
      MYSQL_PASSWORD: ciadelivery
      MYSQL_ROOT_PASSWORD: ciadelivery
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-pciadelivery',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    image: ciadelivery-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *backend-environment
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+process.env.API_PORT+'/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    image: ciadelivery-worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *backend-environment
    ports:
      - '3001:3001'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+process.env.WORKER_PORT+'/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  landing:
    image: ciadelivery-landing
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        BUILD_CONFIGURATION: local
    ports:
      - '4200:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  storefront:
    image: ciadelivery-storefront
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        BUILD_CONFIGURATION: local
    ports:
      - '4201:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  admin:
    image: ciadelivery-admin
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        BUILD_CONFIGURATION: local
    ports:
      - '4202:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  courier:
    image: ciadelivery-courier
    build:
      context: .
      dockerfile: apps/courier/Dockerfile
      args:
        BUILD_CONFIGURATION: local
    ports:
      - '4203:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql_data:
