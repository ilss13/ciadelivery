name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NX_DAEMON: 'false'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t lint

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t typecheck

  unit:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t test -- --testPathIgnorePatterns='integration\.spec'

  integration:
    runs-on: ubuntu-latest
    needs: unit
    env:
      NODE_ENV: local
      API_PORT: '3000'
      WORKER_PORT: '3001'
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '3306'
      DATABASE_USER: ciadelivery
      DATABASE_PASSWORD: ciadelivery
      DATABASE_NAME: ciadelivery
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      PLATFORM_DOMAIN: localhost
      JWT_ACCESS_SECRET: local-development-jwt-access-secret
      CORS_ORIGINS: http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203
      CREDENTIALS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: ciadelivery
          MYSQL_USER: ciadelivery
          MYSQL_PASSWORD: ciadelivery
          MYSQL_ROOT_PASSWORD: ciadelivery
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pciadelivery"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run migrations
        run: |
          for _ in $(seq 1 30); do
            if npm run migration:run; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Integration tests
        run: npx nx run-many -t test -p api,worker -- --testPathPattern='integration\.spec' --passWithNoTests

  build:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t build
      - uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: dist/apps/api
          retention-days: 1

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  container-build:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - name: Skip registry publish without REGISTRY_URL
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        run: |
          if [ -n "$REGISTRY_URL" ]; then
            echo "REGISTRY_URL is set. Refusing to publish images: this workflow does not log in to a registry."
            exit 1
          fi
          echo "registry publish skipped: missing REGISTRY_URL"
      - name: Build api, worker and landing images
        run: |
          docker build -f apps/api/Dockerfile -t "ciadelivery-api:${GITHUB_SHA}" .
          docker build -f apps/worker/Dockerfile -t "ciadelivery-worker:${GITHUB_SHA}" .
          docker build -f apps/landing/Dockerfile -t "ciadelivery-landing:${GITHUB_SHA}" .

  deploy-staging:
    runs-on: ubuntu-latest
    needs: container-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy staging only when STAGING_HOST exists
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          if [ -z "$STAGING_HOST" ]; then
            echo "staging deploy skipped: missing STAGING_HOST"
            exit 0
          fi
          echo "STAGING_HOST is set. Remote staging deploy is not implemented. Do not add an SSH script in this workflow."
          exit 1

  smoke:
    runs-on: ubuntu-latest
    needs: [container-build, deploy-staging]
    if: >-
      always() &&
      needs.container-build.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    env:
      NODE_ENV: local
      API_PORT: '3000'
      WORKER_PORT: '3001'
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '3306'
      DATABASE_USER: ciadelivery
      DATABASE_PASSWORD: ciadelivery
      DATABASE_NAME: ciadelivery
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      PLATFORM_DOMAIN: localhost
      JWT_ACCESS_SECRET: local-development-jwt-access-secret
      CORS_ORIGINS: http://localhost:4200
      CREDENTIALS_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: ciadelivery
          MYSQL_USER: ciadelivery
          MYSQL_PASSWORD: ciadelivery
          MYSQL_ROOT_PASSWORD: ciadelivery
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pciadelivery"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: dist/apps/api
      - name: HTTP smoke against the built API
        run: |
          node dist/apps/api/main.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          trap 'kill "$(cat /tmp/api.pid)" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/health/liveness >/dev/null; then
              curl -fsS http://127.0.0.1:3000/health/liveness
              echo
              curl -fsS http://127.0.0.1:3000/health/readiness
              echo
              exit 0
            fi
            sleep 3
          done
          cat /tmp/api.log
          exit 1
