<header class="bar">
  <strong>Painel</strong>
  @if (user(); as current) {
  <span>{{ current.name }}</span>
  } @if (canConfigure()) {
  <a routerLink="/configuracoes">Configurações</a>
  } @if (canManageCatalog()) {
  <a routerLink="/cardapio">Cardápio</a>
  } @if (canReadOrders()) {
  <a routerLink="/pedidos">Pedidos</a>
  } @if (canReadCustomers()) {
  <a routerLink="/clientes">Clientes</a>
  }
  <button type="button" (click)="logout()">Sair</button>
</header>
<main class="stack">
  <router-outlet></router-outlet>
</main>
